name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Tag name is attacker-shaped input, so it goes through env, never
      # straight into the script body.
      - name: Get version from release
        id: get_version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: ./app
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          echo "Building Dev Cockpit $VERSION for $GOOS/$GOARCH"
          go build \
            -ldflags="-X main.version=$VERSION -s -w" \
            -o "../devcockpit-$GOOS-$GOARCH" \
            ./cmd/devcockpit

      - name: Generate checksum
        env:
          ASSET: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"

      # Uploaded with the preinstalled gh CLI rather than a third-party action,
      # so nothing outside GitHub holds contents:write on this repo.
      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
          path: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
