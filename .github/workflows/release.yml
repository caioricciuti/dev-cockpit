name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get version from release
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        working-directory: ./app
        run: |
          echo "Building Dev Cockpit ${{ steps.get_version.outputs.VERSION }} for ${{ matrix.os }}/${{ matrix.arch }}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }} -s -w" \
            -o ../devcockpit-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/devcockpit

      - name: Generate checksum
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum devcockpit-${{ matrix.os }}-${{ matrix.arch }} > devcockpit-${{ matrix.os }}-${{ matrix.arch }}.sha256
          else
            shasum -a 256 devcockpit-${{ matrix.os }}-${{ matrix.arch }} > devcockpit-${{ matrix.os }}-${{ matrix.arch }}.sha256
          fi
          cat devcockpit-${{ matrix.os }}-${{ matrix.arch }}.sha256

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            devcockpit-${{ matrix.os }}-${{ matrix.arch }}
            devcockpit-${{ matrix.os }}-${{ matrix.arch }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
          path: devcockpit-${{ matrix.os }}-${{ matrix.arch }}
